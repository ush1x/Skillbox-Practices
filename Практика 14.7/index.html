<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Список фильмов</title>
</head>
<body>
    <form class="movie-form" novalidate>
        <div class="field">
            <label>
                Название:
                <input type="text" name="title" class="title-input">
            </label>
            <span class="error title-error"></span>
        </div>

        <div class="field">
            <label>
                Жанр:
                <input type="text" name="genre" class="genre-input">
            </label>
            <span class="error genre-error"></span>
        </div>

        <div class="field">
            <label>
                Год:
                <input type="number" name="year" class="year-input">
            </label>
            <span class="error year-error"></span>
        </div>

        <label class="field field-checkbox">
            <input type="checkbox" name="watched" class="watched-input">
            Успели посмотреть?
        </label>

        <div class="form-buttons">
            <button type="submit" class="submit-button">Добавить</button>
            <button type="button" class="cancel-button" hidden>Отменить редактирование</button>
        </div>
    </form>

    <div class="sort-panel">
        <select class="sort-select">
            <option value="title">Название</option>
            <option value="genre">Жанр</option>
            <option value="year" selected>Год</option>
        </select>
        <button type="button" class="sort-button">Сортировать</button>
    </div>

    <div class="table-wrapper">
        <table class="movie-table">
            <thead>
                <tr>
                    <th>Название</th>
                    <th>Жанр</th>
                    <th>Год</th>
                    <th>Успели посмотреть?</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="index.js"></script>
</body>
</html>
