<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Калькулятор стоимости доставки</title>
</head>
<body>
    <h1>Калькулятор стоимости доставки</h1>

    <form class="product-form" novalidate>
        <p>
            <label>
                Название товара:
                <input type="text" name="name" class="name-input">
            </label>
            <span class="error name-error"></span>
        </p>

        <p>
            <label>
                Вес товара (кг):
                <input type="number" name="weight" class="weight-input" step="any">
            </label>
            <span class="error weight-error"></span>
        </p>

        <p>
            <label>
                Расстояние доставки (км):
                <input type="number" name="distance" class="distance-input" step="any">
            </label>
            <span class="error distance-error"></span>
        </p>

        <button type="submit" class="add-button">Добавить товар</button>
    </form>

    <table class="product-table">
        <thead>
            <tr>
                <th>Название товара</th>
                <th>Вес (кг)</th>
                <th>Расстояние (км)</th>
                <th>Стоимость доставки</th>
            </tr>
        </thead>
        <tbody>
            <!-- здесь будут добавляться товары -->
        </tbody>
    </table>

    <script src="index.js"></script>
</body>
</html>
